specify std.optparse:
- before: |
    OptionParser = require 'std.optparse'

    help = [[
    parseme (stdlib spec) 0α1

    Copyright © 2026 Gary V. Vaughan
    This test program comes with ABSOLUTELY NO WARRANTY.

    Usage: parseme [<options>] <file>...

    Banner text.

    Long description.

    Options:

      -h, --help               display this help, then exit
          --version            display version information, then exit
      -b                       a short option with no long option
          --long               a long option with no short option
          --another-long       a long option with internal hypen
          --true               a Lua keyword as an option name
      -v, --verbose            a combined short and long option
      -n, --dryrun, --dry-run  several spellings of the same option
      -u, --name=USER          require an argument
      -o, --output=[FILE]      accept an optional argument
      --                       end of options

    Footer text.

    Please report bugs at <http://github.com/lua-stdlib/lua-stdlib/issues>.
    ]]

    -- strip off the leading whitespace required for YAML
    parser = OptionParser(help:gsub('^    ', ''))

- context when required:
  - context by name:
    - it does not touch the global table:
        expect(show_apis {added_to='_G', by='std.optparse'}).
          to_equal {}

- describe OptionParser:
  - it recognises the program name:
      expect(parser.program).to_be 'parseme'
  - it recognises the version number:
      expect(parser.version).to_be '0α1'
  - it recognises the version text:
      expect(parser.versiontext).
        to_match '^parseme .*Copyright .*NO WARRANTY%.'
  - it recognises the help text: |
      expect(parser.helptext).
        to_match('^Usage: parseme .*Banner .*Long .*Options:.*' ..
                      'Footer .*/issues>%.')
  - it diagnoses incorrect input text:
      expect(OptionParser 'garbage in').to_raise 'argument must match'

- describe Object methods:
  - it has an OptionParser prototype:
      expect(OptionParser:prototype()).to_be 'OptionParser'
      expect(parser:prototype()).to_be 'OptionParser'
      expect(parser:type()).to_be 'OptionParser'
  - it clones a new parser from help text: |
      other = parser:clone 'other 1\nUsage: other\n'
      expect(other.program).to_be 'other'
      expect(other.version).to_be '1'
      expect(getmetatable(other)).to_be(getmetatable(parser))
  - it maps fields into a parser:
      expect(parser:mapfields {program = 'renamed'}).to_be(parser)
      expect(parser.program).to_be 'renamed'
  - it leaves the optparse prototype alone:
      expect(getmetatable(require 'optparse'.prototype).__index.clone).
        to_be(nil)

- describe parser:
  # The 'optparse' package's own specs cover parsing; these only check
  # that std.optparse parsers delegate to it.
  - it parses an argument list:
      args, opts = parser:parse {'-b', '--name=Gary', 'file', '-x'}
      expect(args).to_equal {'file', '-x'}
      expect(opts).to_equal {b = true, name = 'Gary'}
  - it lets io.die and io.warn find the program name:
      args, opts = parser:parse {}
      expect(opts.program).to_be 'parseme'
  - it merges in default option values:
      args, opts = parser:parse({'-v'}, {name = 'default'})
      expect(opts).to_equal {name = 'default', verbose = true}
